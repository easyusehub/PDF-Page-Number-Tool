<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Page Number Tool</title>
<style>
/* Tor original style */
body { font-family: Arial,sans-serif; margin:0; padding:0; background:#f9f9f9; color:#333; position: relative; overflow-x: hidden; }
header { padding:15px; background:#9333ea; color:#fff; text-align:center; }
header h1 { margin:0; font-size:1.8rem; }
.container { max-width:900px; margin:20px auto; padding:0 15px; }

/* Upload Box */
#upload-box { border:3px dashed #9333ea; padding:20px; text-align:center; cursor:pointer; border-radius:10px; background:#fff; margin-bottom:15px; }

/* Page Selection Area */
#page-selection { margin-bottom:10px; display:flex; flex-wrap:wrap; gap:10px; min-height: 20px; border: 1px solid #eee; padding: 10px; }
#page-selection label { background:#f0f0f0; padding:5px 10px; border-radius:5px; cursor:pointer; font-size: 14px; border: 1px solid #ddd; }

/* Sequence Layout */
#number-controls { margin-bottom:10px; display:flex; flex-direction: column; align-items:center; gap:10px; }
.btn-group { display: flex; gap: 10px; }

#pdf-viewer { width:100%; border:1px solid #ccc; overflow:auto; margin-bottom:20px; background:#fff; min-height: 200px; }
#pdf-viewer canvas { display:block; width:100%; height:auto; margin-bottom:10px; }

button { padding:10px 20px; border:none; border-radius:8px; background:#9333ea; color:#fff; cursor:pointer; margin:5px; font-weight: bold; }
input[type=number] { padding:8px; width:100px; border-radius:5px; border:1px solid #ccc; text-align: center; }

/* Ad Styles */
.custom-ad-bridge { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; padding: 20px; margin: 10px 0; border-radius: 8px; cursor: pointer; text-align: center; }
.ad-btn { background: #fbbf24; color: #000; padding: 5px 15px; border-radius: 5px; font-weight: bold; display: inline-block; margin-top: 5px; }

/* Nav Buttons niche */
.bottom-nav { display: flex; justify-content: center; gap: 10px; margin-top: 15px; padding-bottom: 20px; }
</style>
</head>
<body>

<header><h1>PDF Page Number Tool</h1></header>

<div class="container">
    <div class="custom-ad-bridge" onclick="window.open('https://easyusehub.blogspot.com', '_blank')">
        <b>🚀 Try 46+ Premium Free Web Tools!</b><br>
        <div class="ad-btn">Open EasyUseHub</div>
    </div>

    <div id="upload-box" onclick="document.getElementById('fileInput').click();">📁 Click to Upload PDF</div>
    <input type="file" id="fileInput" accept="application/pdf" style="display:none;">

    <div class="custom-ad-bridge" style="background: linear-gradient(135deg, #059669, #10b981);" onclick="window.open('https://easyusehub.blogspot.com/p/image-compressor.html', '_blank')">
        <b>⚡ Image Compressor</b><br>
        <small>Free at EasyUseHub</small>
    </div>

    <div id="page-selection">Upload a PDF to see page options...</div>

    <div id="number-controls">
        <input type="number" id="pageNumberInput" placeholder="Start No.">
        <div class="btn-group">
            <button id="addNumberBtn">Add Number</button>
            <button id="autoNumberAll">Auto Number All</button>
        </div>
        <button id="downloadPdf" style="background:#2563eb; width: 220px;">📥 Download PDF</button>
    </div>

    <div id="pdf-viewer"></div>

    <div class="custom-ad-bridge" style="background: linear-gradient(135deg, #f59e0b, #d97706);" onclick="window.open('https://easyusehub.blogspot.com/p/ultimate-calculators-hub.html', '_blank')">
        <b>🔢 Visit Calculators Hub</b><br>
        <div class="ad-btn" style="background:#000; color:#fff;">Visit Now</div>
    </div>

    <div class="bottom-nav">
        <button onclick="window.location.href='https://easyusehub.blogspot.com/?m=1'">🏠 Home</button>
        <button onclick="window.location.href='https://easyusehub.blogspot.com/p/free-pdf-tools-online.html'">📚 All Tools</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script>
const fileInput = document.getElementById('fileInput');
const pdfViewer = document.getElementById('pdf-viewer');
const pageSelection = document.getElementById('page-selection');
const addNumberBtn = document.getElementById('addNumberBtn');
const pageNumberInput = document.getElementById('pageNumberInput');
const autoNumberAll = document.getElementById('autoNumberAll');
const downloadBtn = document.getElementById('downloadPdf');

let pdfDoc = null, pdfBytes = null;
let numberData = []; 

// File Upload Logic (Tor original script)
fileInput.addEventListener('change', async e => {
    const file = e.target.files[0];
    if(!file) return;

    pdfBytes = await file.arrayBuffer();
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    
    try {
        pdfDoc = await pdfjsLib.getDocument({data: pdfBytes}).promise;
        renderAllPages();
        createPageSelection();
    } catch (err) {
        alert("Error loading PDF: " + err.message);
    }
});

async function renderAllPages(){
    pdfViewer.innerHTML = '';
    numberData = new Array(pdfDoc.numPages).fill("");
    for(let p=1; p<=pdfDoc.numPages; p++){
        const page = await pdfDoc.getPage(p);
        const viewport = page.getViewport({scale: 0.5}); // Scale ektu komiyechi speed-er jonne
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        await page.render({canvasContext: context, viewport: viewport}).promise;
        pdfViewer.appendChild(canvas);
    }
}

function createPageSelection(){
    pageSelection.innerHTML = '';
    for(let i=1; i<=pdfDoc.numPages; i++){
        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = true;
        checkbox.dataset.page = i;
        label.appendChild(checkbox);
        label.append(" Page " + i);
        pageSelection.appendChild(label);
    }
}

addNumberBtn.onclick = () => {
    const number = pageNumberInput.value;
    if(!number) { alert("Enter a number"); return; }
    const checkboxes = pageSelection.querySelectorAll('input[type=checkbox]');
    checkboxes.forEach(cb => {
        if(cb.checked) numberData[parseInt(cb.dataset.page) - 1] = number;
    });
    alert("Number added to selected pages!");
};

autoNumberAll.onclick = () => {
    let counter = parseInt(pageNumberInput.value) || 1;
    const checkboxes = pageSelection.querySelectorAll('input[type=checkbox]');
    checkboxes.forEach(cb => {
        if(cb.checked) numberData[parseInt(cb.dataset.page) - 1] = (counter++).toString();
    });
    alert("Auto-numbering done!");
};

downloadBtn.onclick = async () => {
    if(!pdfBytes) return;
    const pdfLibDoc = await PDFLib.PDFDocument.load(pdfBytes);
    const pages = pdfLibDoc.getPages();
    pages.forEach((page, i) => {
        if(numberData[i]){
            page.drawText(numberData[i], {
                x: page.getWidth()/2 - 10,
                y: 25,
                size: 20,
                color: PDFLib.rgb(0, 0, 0) // Black color
            });
        }
    });
    const bytes = await pdfLibDoc.save();
    const blob = new Blob([bytes], {type:'application/pdf'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'numbered.pdf';
    link.click();
};
</script>
</body>
</html>
