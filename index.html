<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Page Number Tool</title>
<meta name="description" content="Upload PDF, select pages, add editable page numbers manually or auto-number all pages. Clear PDF display, mobile-friendly, multi-page support.">
<style>
body { font-family: Arial,sans-serif; margin:0; padding:0; background:#f9f9f9; color:#333; }
header { padding:15px; background:#9333ea; color:#fff; text-align:center; }
header h1 { margin:0; font-size:1.8rem; }
header p { margin:5px 0 0; font-size:0.95rem; }
.ad-placeholder { width:100%; height:60px; background:#ccc; text-align:center; line-height:60px; margin:10px 0; border-radius:8px; }
.container { max-width:900px; margin:20px auto; padding:0 15px; }
#upload-box { border:3px dashed #9333ea; padding:20px; text-align:center; cursor:pointer; border-radius:10px; background:#fff; margin-bottom:15px; }
#page-selection { margin-bottom:10px; display:flex; flex-wrap:wrap; gap:10px; }
#page-selection label { background:#f0f0f0; padding:5px 10px; border-radius:5px; cursor:pointer; }
#number-controls { margin-bottom:10px; display:flex; gap:10px; align-items:center; }
#pdf-viewer { width:100%; border:1px solid #ccc; overflow:auto; margin-bottom:20px; background:#fff; position:relative; }
#pdf-viewer canvas { display:block; width:100%; height:auto; margin-bottom:10px; }
.page-number { position:absolute; bottom:5px; left:50%; transform:translateX(-50%); font-size:24px; color:#000; background:rgba(255,255,255,0.6); padding:2px 5px; border-radius:4px; cursor:text; display:none; }
.controls { display:flex; flex-wrap:wrap; justify-content:center; margin-bottom:10px; }
button { padding:10px 20px; border:none; border-radius:8px; background:#9333ea; color:#fff; cursor:pointer; margin:5px; }
input[type=number] { padding:5px; width:80px; border-radius:5px; border:1px solid #ccc; }
#toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#9333ea; color:#fff; padding:10px 20px; border-radius:8px; display:none; z-index:9999; }
</style>
</head>
<body>

<header>
<h1>PDF Page Number Tool</h1>
<p>Select pages, add/edit page numbers manually or auto-number all pages.</p>
</header>

<div class="ad-placeholder">Top Ad Placeholder</div>

<div class="container">
<div id="upload-box">📁 Upload PDF</div>
<input type="file" id="fileInput" accept="application/pdf" hidden>

<div class="ad-placeholder">Middle Ad Placeholder</div>

<div id="page-selection"></div>

<div id="number-controls">
<input type="number" id="pageNumberInput" placeholder="Type number">
<button id="addNumberBtn">Add Number</button>
<button id="autoNumberAll">Auto Number Selected Pages</button>
</div>

<div class="controls">
<button onclick="window.location.href='https://easyusehub.blogspot.com/?m=1'">🏠 Home</button>
<button onclick="window.location.href='https://easyusehub.blogspot.com/p/free-pdf-tools-online.html'">📚 All PDF Tools</button>
<button id="downloadPdf">Download PDF</button>
</div>

<div id="pdf-viewer"></div>

<div id="toast">PDF downloaded!</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script>
const uploadBox = document.getElementById('upload-box');
const fileInput = document.getElementById('fileInput');
const pdfViewer = document.getElementById('pdf-viewer');
const pageSelection = document.getElementById('page-selection');
const addNumberBtn = document.getElementById('addNumberBtn');
const pageNumberInput = document.getElementById('pageNumberInput');
const autoNumberAll = document.getElementById('autoNumberAll');
const downloadBtn = document.getElementById('downloadPdf');
const toast = document.getElementById('toast');

let pdfDoc = null, pdfBytes = null;
let canvasList = [], numberDivs = [];

uploadBox.onclick = () => fileInput.click();

fileInput.addEventListener('change', async e => {
    const file = e.target.files[0];
    if(!file) return;
    pdfBytes = await file.arrayBuffer();
    pdfDoc = await pdfjsLib.getDocument({data: pdfBytes}).promise;
    renderAllPages();
    createPageSelection();
});

async function renderAllPages(){
    pdfViewer.innerHTML = '';
    canvasList = [];
    numberDivs = [];

    for(let p=1; p<=pdfDoc.numPages; p++){
        const page = await pdfDoc.getPage(p);
        const viewport = page.getViewport({scale:1});
        const scale = pdfViewer.clientWidth / viewport.width;
        const scaledViewport = page.getViewport({scale:scale});

        const canvas = document.createElement('canvas');
        canvas.width = scaledViewport.width;
        canvas.height = scaledViewport.height;
        await page.render({canvasContext: canvas.getContext('2d'), viewport: scaledViewport}).promise;
        pdfViewer.appendChild(canvas);
        canvasList.push(canvas);

        const numDiv = document.createElement('div');
        numDiv.className = 'page-number';
        numDiv.contentEditable = true;
        numDiv.innerText = '';
        numDiv.dataset.page = p;
        pdfViewer.appendChild(numDiv);
        numberDivs.push(numDiv);
    }
}

function createPageSelection(){
    pageSelection.innerHTML = '';
    for(let i=1; i<=pdfDoc.numPages; i++){
        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.dataset.page = i;
        label.appendChild(checkbox);
        label.append(` Page ${i}`);
        pageSelection.appendChild(label);
    }
}

addNumberBtn.onclick = () => {
    const number = pageNumberInput.value;
    if(!number) return;
    pageSelection.querySelectorAll('input[type=checkbox]').forEach(cb=>{
        if(cb.checked){
            const page = parseInt(cb.dataset.page) - 1;
            numberDivs[page].innerText = number;
            numberDivs[page].style.display = 'block';
        }
    });
    pageNumberInput.value = '';
};

// Auto number selected pages
autoNumberAll.onclick = () => {
    let counter = 1;
    pageSelection.querySelectorAll('input[type=checkbox]').forEach(cb=>{
        if(cb.checked){
            const page = parseInt(cb.dataset.page) - 1;
            numberDivs[page].innerText = counter++;
            numberDivs[page].style.display = 'block';
        }
    });
};

// Download PDF with page numbers
downloadBtn.onclick = async () => {
    const pdfLibDoc = await PDFLib.PDFDocument.load(pdfBytes);
    const pages = pdfLibDoc.getPages();
    const color = PDFLib.rgb(0,0,0);

    pages.forEach((page,i)=>{
        if(numberDivs[i].style.display === 'block'){
            const text = numberDivs[i].innerText || '';
            const x = page.getWidth()/2 - 10;
            const y = 10;
            page.drawText(text,{x:x, y:y, size:24, color:color});
        }
    });

    const bytes = await pdfLibDoc.save();
    const blob = new Blob([bytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'numbered-'+fileInput.files[0].name;
    a.click();
    toast.style.display='block';
    setTimeout(()=>{toast.style.display='none';},2500);
};
</script>

</body>
</html>
