<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📝 PDF Page Number Tool</title>
<meta name="description" content="Automatically add page numbers to PDFs online. Select pages, choose color, auto position & font size. Mobile-friendly, multi-page support.">
<style>
body { font-family: Arial,sans-serif; margin:0; padding:0; background:#f9f9f9; color:#333; }
header { padding:15px; background:#9333ea; color:#fff; text-align:center; }
header h1 { margin:0; font-size:1.8rem; }
header p { margin:5px 0 0; font-size:0.95rem; }
.ad-placeholder { width:100%; height:60px; background:#ccc; text-align:center; line-height:60px; margin:10px 0; border-radius:8px; }
.container { max-width:900px; margin:20px auto; padding:0 15px; }
#upload-box { border:3px dashed #9333ea; padding:20px; text-align:center; cursor:pointer; border-radius:10px; background:#fff; margin-bottom:15px; }
#pdf-viewer { width:100%; height:60vh; border:1px solid #ccc; overflow:auto; margin-bottom:20px; background:#fff; position:relative; }
#pdf-viewer canvas { display:block; width:100%; height:auto; }
.controls { display:flex; flex-wrap:wrap; justify-content:center; margin-bottom:10px; }
button { padding:10px 20px; border:none; border-radius:8px; background:#9333ea; color:#fff; cursor:pointer; margin:5px; }
#toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#9333ea; color:#fff; padding:10px 20px; border-radius:8px; display:none; z-index:9999; }
#page-settings { text-align:center; margin-bottom:15px; }
#page-settings input { margin:5px; padding:5px; border-radius:5px; border:1px solid #ccc; }
</style>
</head>
<body>

<header>
<h1>📝 PDF Auto Page Number Tool</h1>
<p>Select pages, choose color, preview & download numbered PDF.</p>
</header>

<div class="ad-placeholder">Top Ad Placeholder</div>

<div class="container">
<div id="upload-box">📁 Upload PDF</div>
<input type="file" id="fileInput" accept="application/pdf" hidden>

<div class="ad-placeholder">Middle Ad Placeholder</div>

<div class="controls">
<button onclick="window.location.href='https://easyusehub.blogspot.com/?m=1'">🏠 Home</button>
<button onclick="window.location.href='https://easyusehub.blogspot.com/p/free-pdf-tools-easyusehub.html?m=1'">📚 All PDF Tools</button>
</div>

<div id="page-settings">
<label>Start #: <input type="number" id="startNum" value="1"></label>
<label>Prefix: <input type="text" id="prefix" placeholder="Page "></label>
<label>Suffix: <input type="text" id="suffix" placeholder=" of total"></label>
<label>Color: <input type="color" id="fontColor" value="#000000"></label>
<br>
<button id="previewNumbers">Preview</button>
<button id="applyNumbers">Apply & Download</button>
</div>

<div id="pdf-viewer"></div>

<div class="controls">
<button id="prev-page">⬅ Prev</button>
<button id="next-page">Next ➡</button>
</div>

<div id="toast">PDF downloaded!</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script>
const uploadBox = document.getElementById('upload-box');
const fileInput = document.getElementById('fileInput');
const pdfViewer = document.getElementById('pdf-viewer');
const prevBtn = document.getElementById('prev-page');
const nextBtn = document.getElementById('next-page');
const toast = document.getElementById('toast');

const startNumInput = document.getElementById('startNum');
const prefixInput = document.getElementById('prefix');
const suffixInput = document.getElementById('suffix');
const fontColorInput = document.getElementById('fontColor');
const previewBtn = document.getElementById('previewNumbers');
const applyBtn = document.getElementById('applyNumbers');

let pdfDoc = null, pdfBytes = null, currentPage = 1, scale = 1;
let canvas = null;
let overlayDiv = null;

uploadBox.onclick = ()=>fileInput.click();

fileInput.addEventListener('change', async e=>{
  const file = e.target.files[0];
  if(!file) return;
  pdfBytes = await file.arrayBuffer();
  pdfDoc = await pdfjsLib.getDocument({data: pdfBytes}).promise;
  renderPage(1);
});

async function renderPage(pageNum){
  const page = await pdfDoc.getPage(pageNum);
  const viewport = page.getViewport({scale:1});
  scale = pdfViewer.clientWidth / viewport.width;
  const scaledViewport = page.getViewport({scale:scale});

  if(canvas) canvas.remove();
  canvas = document.createElement('canvas');
  canvas.width = scaledViewport.width;
  canvas.height = scaledViewport.height;
  await page.render({canvasContext:canvas.getContext('2d'), viewport:scaledViewport}).promise;
  pdfViewer.innerHTML='';
  pdfViewer.appendChild(canvas);

  if(overlayDiv) overlayDiv.remove();
}

prevBtn.onclick = ()=>{ if(currentPage>1) renderPage(--currentPage); };
nextBtn.onclick = ()=>{ if(currentPage<pdfDoc.numPages) renderPage(++currentPage); };

function createOverlay(){
  if(overlayDiv) overlayDiv.remove();
  overlayDiv = document.createElement('div');
  overlayDiv.style.position='absolute';
  overlayDiv.style.top='0';
  overlayDiv.style.left='0';
  overlayDiv.style.width='100%';
  overlayDiv.style.height='100%';
  overlayDiv.style.pointerEvents='none';
  overlayDiv.style.fontWeight='bold';
  pdfViewer.appendChild(overlayDiv);

  const startNum = parseInt(startNumInput.value);
  const prefix = prefixInput.value;
  const suffix = suffixInput.value;
  const color = fontColorInput.value;

  for(let i=0;i<pdfDoc.numPages;i++){
    const text = prefix + (startNum+i) + suffix;
    const div = document.createElement('div');
    div.textContent = text;
    div.style.position='absolute';
    // Auto position: bottom-right, avoid overlapping
    div.style.bottom='10px';
    div.style.right='10px';
    div.style.color=color;
    div.style.fontSize='16px';
    overlayDiv.appendChild(div);
  }
}

previewBtn.onclick = ()=>createOverlay();

applyBtn.onclick = async ()=>{
  const pdfLibDoc = await PDFLib.PDFDocument.load(pdfBytes);
  const pages = pdfLibDoc.getPages();
  const startNum = parseInt(startNumInput.value);
  const prefix = prefixInput.value;
  const suffix = suffixInput.value;
  const colorHex = fontColorInput.value;
  const color = PDFLib.rgb(
    parseInt(colorHex.slice(1,3),16)/255,
    parseInt(colorHex.slice(3,5),16)/255,
    parseInt(colorHex.slice(5,7),16)/255
  );

  pages.forEach((page,i)=>{
    const text = prefix + (startNum+i) + suffix;
    const x = page.getWidth()-50; // auto bottom-right
    const y = 10;
    page.drawText(text,{x:x,y:y,size:16,color:color});
  });

  const bytes = await pdfLibDoc.save();
  const blob = new Blob([bytes],{type:'application/pdf'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='numbered-'+fileInput.files[0].name;
  a.click();
  toast.style.display='block';
  setTimeout(()=>{toast.style.display='none';},2500);
};
</script>
</body>
</html>
