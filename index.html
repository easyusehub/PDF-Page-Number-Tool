<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📝 PDF Page Number Tool</title>
<meta name="description" content="Add page numbers to PDFs online. Multi-page, mobile-friendly, customize position, alignment, color, and font size. EasyUseHub PDF Tools.">
<style>
body { font-family: Arial,sans-serif; margin:0; padding:0; background:#f9f9f9; color:#333; }
header { padding:15px; background:#9333ea; color:#fff; text-align:center; }
header h1 { margin:0; font-size:1.8rem; }
header p { margin:5px 0 0; font-size:0.95rem; }
.ad-placeholder { width:100%; height:60px; background:#ccc; text-align:center; line-height:60px; margin:10px 0; border-radius:8px; }
.container { max-width:900px; margin:20px auto; padding:0 15px; }
#upload-box { border:3px dashed #9333ea; padding:20px; text-align:center; cursor:pointer; border-radius:10px; background:#fff; margin-bottom:15px; }
#pdf-viewer { width:100%; height:70vh; border:1px solid #ccc; overflow:auto; margin-bottom:20px; background:#fff; }
#pdf-viewer canvas { display:block; width:100%; height:auto; }
.controls { display:flex; flex-wrap:wrap; justify-content:center; margin-bottom:10px; }
button { padding:10px 20px; border:none; border-radius:8px; background:#9333ea; color:#fff; cursor:pointer; margin:5px; }
#toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#9333ea; color:#fff; padding:10px 20px; border-radius:8px; display:none; z-index:9999; }
#page-number { text-align:center; margin-bottom:10px; font-weight:bold; }
#page-settings { text-align:center; margin-bottom:10px; }
#page-settings select, #page-settings input { margin:5px; padding:5px; border-radius:5px; border:1px solid #ccc; }
</style>
</head>
<body>

<header>
<h1>📝 PDF Page Number Tool</h1>
<p>Upload PDF, customize page numbers, and download instantly. Mobile-friendly & multi-page supported.</p>
</header>

<div class="ad-placeholder">Top Ad Placeholder</div>

<div class="container">
<div id="upload-box">📁 Upload PDF</div>
<input type="file" id="fileInput" accept="application/pdf" hidden>

<div class="ad-placeholder">Middle Ad Placeholder</div>

<div class="controls">
<button onclick="window.location.href='https://easyusehub.blogspot.com/?m=1'">🏠 Home</button>
<button onclick="window.location.href='https://easyusehub.blogspot.com/p/free-pdf-tools-easyusehub.html?m=1'">📚 All PDF Tools</button>
</div>

<div id="page-number"></div>

<div id="page-settings">
<label>Position:
<select id="position"><option value="bottom">Bottom</option><option value="top">Top</option></select></label>
<label>Alignment:
<select id="align"><option value="center">Center</option><option value="left">Left</option><option value="right">Right</option></select></label>
<label>Font Size: <input type="number" id="fontSize" value="14"></label>
<label>Color: <input type="color" id="fontColor" value="#000000"></label>
</div>

<div id="pdf-viewer"></div>

<div class="controls">
<button id="prev-page">⬅ Prev</button>
<button id="next-page">Next ➡</button>
<button id="add-page-numbers">➕ Add Page Numbers</button>
<button id="download-pdf">📥 Download PDF</button>
</div>

<div id="toast">PDF downloaded!</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script>
const uploadBox = document.getElementById('upload-box');
const fileInput = document.getElementById('fileInput');
const pdfViewer = document.getElementById('pdf-viewer');
const prevBtn = document.getElementById('prev-page');
const nextBtn = document.getElementById('next-page');
const downloadBtn = document.getElementById('download-pdf');
const addNumbersBtn = document.getElementById('add-page-numbers');
const toast = document.getElementById('toast');
const pageNumberDiv = document.getElementById('page-number');
const positionInput = document.getElementById('position');
const alignInput = document.getElementById('align');
const fontSizeInput = document.getElementById('fontSize');
const fontColorInput = document.getElementById('fontColor');

let pdfDoc = null, pdfBytes = null, currentPage = 1, scale = 1;
let canvas = null;

uploadBox.onclick = () => fileInput.click();

fileInput.addEventListener('change', async e => {
  const file = e.target.files[0];
  if(!file) return;
  pdfBytes = await file.arrayBuffer();
  pdfDoc = await pdfjsLib.getDocument({data: pdfBytes}).promise;
  renderPage(1);
});

async function renderPage(pageNum){
  const page = await pdfDoc.getPage(pageNum);
  const viewport = page.getViewport({scale:1});
  const containerWidth = pdfViewer.clientWidth;
  scale = containerWidth / viewport.width;
  const scaledViewport = page.getViewport({scale:scale});

  if(canvas) canvas.remove();
  canvas = document.createElement('canvas');
  canvas.width = scaledViewport.width;
  canvas.height = scaledViewport.height;
  await page.render({canvasContext:canvas.getContext('2d'), viewport:scaledViewport}).promise;
  pdfViewer.innerHTML='';
  pdfViewer.appendChild(canvas);

  pageNumberDiv.textContent = `Page ${currentPage} of ${pdfDoc.numPages}`;
}

prevBtn.onclick = ()=>{ if(currentPage>1) renderPage(--currentPage); };
nextBtn.onclick = ()=>{ if(currentPage<pdfDoc.numPages) renderPage(++currentPage); };

addNumbersBtn.onclick = async () => {
  const pdfLibDoc = await PDFLib.PDFDocument.load(pdfBytes);
  const pages = pdfLibDoc.getPages();
  const fontSize = parseInt(fontSizeInput.value);
  const fontColor = PDFLib.rgb(
    parseInt(fontColorInput.value.slice(1,3),16)/255,
    parseInt(fontColorInput.value.slice(3,5),16)/255,
    parseInt(fontColorInput.value.slice(5,7),16)/255
  );
  const position = positionInput.value;
  const align = alignInput.value;

  pages.forEach((page,i)=>{
    const text = `${i+1}`;
    let x;
    if(align==='left') x=20;
    else if(align==='center') x = page.getWidth()/2;
    else x = page.getWidth() - 20;
    let y = (position==='top') ? page.getHeight() - fontSize - 10 : fontSize + 10;
    if(position==='bottom') y = 10;
    page.drawText(text, {x:x, y:y, size:fontSize, color:fontColor, xSkew:0, ySkew:0, rotate:PDFLib.degrees(0), opacity:1});
  });

  const bytes = await pdfLibDoc.save();
  const blob = new Blob([bytes],{type:'application/pdf'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='page-numbered-'+fileInput.files[0].name;
  a.click();
  toast.style.display='block';
  setTimeout(()=>{toast.style.display='none';},2500);
};

downloadBtn.onclick = async ()=>{
  toast.textContent='Please use "Add Page Numbers" first!';
  toast.style.display='block';
  setTimeout(()=>{toast.style.display='none';},2000);
};
</script>
</body>
</html>
